<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Golden Duck: vịt con mũm mĩm, tô bóng kiểu 3D. Thiết kế riêng của app. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#2b3a5c"/>
      <stop offset="1" stop-color="#0d1526"/>
    </radialGradient>
    <radialGradient id="body" cx="38%" cy="30%" r="80%">
      <stop offset="0" stop-color="#fff6c2"/>
      <stop offset="0.35" stop-color="#ffd84a"/>
      <stop offset="0.75" stop-color="#f5ad12"/>
      <stop offset="1" stop-color="#c97a00"/>
    </radialGradient>
    <radialGradient id="head" cx="36%" cy="28%" r="78%">
      <stop offset="0" stop-color="#fff8d1"/>
      <stop offset="0.3" stop-color="#ffdf5c"/>
      <stop offset="0.75" stop-color="#f6b218"/>
      <stop offset="1" stop-color="#cf8203"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffd23d"/>
      <stop offset="1" stop-color="#e09000"/>
    </linearGradient>
    <linearGradient id="beakTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb066"/>
      <stop offset="1" stop-color="#ff6a1a"/>
    </linearGradient>
    <linearGradient id="beakBot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f05a0e"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="eye" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#3b3f52"/>
      <stop offset="1" stop-color="#0b0d14"/>
    </radialGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff7aa8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff7aa8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffc83a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffc83a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect x="2" y="2" width="252" height="252" rx="56" fill="none" stroke="#f2b33d" stroke-opacity="0.45" stroke-width="3"/>
  <circle cx="128" cy="132" r="112" fill="url(#glow)"/>
  <g transform="translate(128 126) scale(1.1) translate(-127 -120)">
  <ellipse cx="136" cy="220" rx="84" ry="14" fill="url(#shade)"/>

  <!-- thân và đuôi vểnh -->
  <path d="M60 168 C56 126 96 112 140 116 C176 119 196 128 214 108 C222 100 232 104 228 118 C222 140 222 150 218 166 C210 204 172 216 132 216 C88 216 63 200 60 168 Z" fill="url(#body)"/>
  <!-- cánh -->
  <path d="M120 156 C140 140 182 142 194 160 C200 170 190 186 172 192 C156 197 138 194 128 186 C134 186 142 184 146 180 C136 182 126 180 120 174 C128 174 136 172 140 168 C132 168 124 164 120 156 Z" fill="url(#wing)"/>
  <path d="M130 186 C142 194 160 194 174 188" fill="none" stroke="#b86d00" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>

  <!-- đầu -->
  <circle cx="104" cy="96" r="58" fill="url(#head)"/>
  <!-- chỏm tóc -->
  <path d="M100 40 C96 26 108 20 116 26 C110 28 108 34 112 40 C116 30 128 30 130 38 C122 38 118 42 118 46" fill="#ffd23d" stroke="#e09a00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- mỏ -->
  <path d="M60 104 C44 104 30 108 28 116 C32 123 48 125 62 120 Z" fill="url(#beakBot)"/>
  <path d="M62 90 C44 87 27 94 23 105 C25 112 42 115 64 111 C70 104 69 94 62 90 Z" fill="url(#beakTop)"/>
  <ellipse cx="40" cy="99" rx="9" ry="3.5" fill="#fff" opacity="0.55" transform="rotate(-10 40 99)"/>

  <!-- mắt -->
  <ellipse cx="96" cy="86" rx="11" ry="14" fill="url(#eye)"/>
  <circle cx="92" cy="80" r="4.6" fill="#fff"/>
  <circle cx="100" cy="93" r="2" fill="#fff" opacity="0.8"/>

  <!-- má hồng -->
  <ellipse cx="124" cy="114" rx="16" ry="11" fill="url(#blush)"/>

  <!-- ánh sáng 3D -->
  <ellipse cx="82" cy="62" rx="20" ry="11" fill="#fff" opacity="0.55" transform="rotate(-28 82 62)"/>
  <ellipse cx="96" cy="138" rx="18" ry="8" fill="#fff" opacity="0.35" transform="rotate(-12 96 138)"/>
  </g>
</svg>
